<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
             h1{
                text-align: center;
             }
              .slider img{
                width: 100%;
                height: 600px;
                
              }
              .buttons{
                text-align: center;
              }
              .buttons input{
                padding: 20px;  
                margin: 10px;
                color: black;
                background-color: aqua;
                border: none;
                cursor: pointer;
              }
            
    </style>
</head>
<body>
    <h1>Slider</h1>
    <main >
<div class="mainContent">
        <div class="slider">
            <img src="img1.png" id="imageslider" alt="img1"/>
        </div>
        </div>
     
      <div class="buttons">
        <input type="button" value="prev" id="prevbtn"/>
      <input type="button" value="next" id="nextbtn"/>
      </div>
    </main>

    <script>
        let image = document.getElementById('imageslider');
        let images =["img1.png","mg.png","img2.png"];
        let nextbtn =document.getElementById('nextbtn');
        let prevbtn =document.getElementById('prevbtn');



        let currentIndex = 0;
     nextbtn.addEventListener("click",function(){

                  currentIndex++;
                  if(currentIndex==images.length){
                    currentIndex=0;
                  }
                  image.src=images[currentIndex];

        })

       
        prevbtn.addEventListener('click',function(){
            currentIndex--;
            if(currentIndex<0){
                currentIndex=images.length-1;
            }
            image.src=images[currentIndex];
        })

  setInterval(function(){
        currentIndex++;
        if(currentIndex==images.length){
            currentIndex=0;
        }
        image.src=images[currentIndex]
  },3000);


    </script>
</body>
</html>
