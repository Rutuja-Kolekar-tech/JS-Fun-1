    <script>

        class Person {
            constructor(name){
                this._name=name;
            }
            get firstname(){
               return this._name;
            }
            set firstname(newname){
                if(newname){
                    this._name=newname;
                }
                else{
                    console.log('name can not be empty');
                }
            }
        }

        const person = new  Person("Ruu");
        console.log(person.firstname)

        person.firstname="ish";
        console.log(person.firstname);

    </script>
